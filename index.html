<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Impacto Digital</title>
  <style>
    :root {
      --bg:    #0f0c0a;
      --fg:    #f4ede1;
      --gold:  #c89e5a;
      --dim:   #8a7458;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
    }
    .card { max-width: 520px; }
    .kicker {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      font-size: 12px;
      color: var(--gold);
      margin-bottom: 24px;
      font-weight: 600;
    }
    h1 {
      font-size: clamp(40px, 8vw, 72px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }
    p {
      font-size: 17px;
      line-height: 1.6;
      color: #cab9a3;
      margin-bottom: 32px;
    }
    .contact {
      font-size: 14px;
      color: var(--dim);
      letter-spacing: 0.05em;
    }
    .contact a { color: var(--gold); text-decoration: none; }
    .contact a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <p class="kicker">Impacto Digital</p>
    <h1>Diseñamos webs que captan clientes.</h1>
    <p>
      Páginas guapas, optimizadas, con sistema de reservas y SEO local.
      Las demos individuales se envían directamente al propietario por enlace privado.
    </p>
    <p class="contact">
      <a href="https://wa.me/34678643381">+34 678 64 33 81</a><br>
      <a href="mailto:pedronuneztrabajos@gmail.com">pedronuneztrabajos@gmail.com</a>
    </p>
  </main>
</body>
</html>
